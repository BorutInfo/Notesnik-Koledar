<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<!-- interactive-widget: naj tipkovnica stran res pomanjša, ne le potisne.
     iOS Safari tega (še) ne podpira – tam to opravi Visual Viewport API
     spodaj. Za Android in Chrome je to zastonj popravek. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>Notesnik</title>
<style>
/* ============================================================
   1. SPREMENLJIVKE IN OSNOVE
   ============================================================ */
:root{
  color-scheme: light;      /* brskalnik naj svoje dele riše svetlo */
  --bg:#f6f6f4;
  --surface:#ffffff;
  --line:#e4e3df;
  --text:#1c1b19;
  --dim:#8a8781;
  --accent:#4f46e5;
  --accent-soft:#eceafe;
  --danger:#c0392b;
  --today:#fff6e0;
  --obrocek:#4f46e5;      /* obroba obročka z odprtimi nalogami; sklop 5 jo bo
                             prestavljal po stopnji nujnosti (bela–zelena–rumena–oranžna–rdeča) */
  --radius:14px;
  --topbar-h:56px;
  --bottombar-h:64px;
  /* Vidni del zaslona. Dokler ni tipkovnice, je to cel zaslon.
     Ko se tipkovnica odpre, ju popravi Visual Viewport API. */
  --vidna-visina:100%;
  --vidni-vrh:0px;
}
/* TEMNI NAČIN JE ZAENKRAT IZKLOPLJEN.
   Aplikacija ne sledi več sistemski nastavitvi telefona; vedno je svetla.
   Ko bodo prišle nastavitve, se bo tema izbirala tam. Vrednosti so
   shranjene spodaj, da jih bo mogoče vrniti brez ugibanja.

@media (prefers-color-scheme: dark){
  :root{
    --bg:#131312;
    --surface:#1d1d1c;
    --line:#2e2e2c;
    --text:#eeedea;
    --dim:#8d8b86;
    --accent:#8b85f5;
    --accent-soft:#26244a;
    --danger:#e57373;
    --today:#2a2415;
  }
}
*/
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
/* nujno: naši gumbi imajo display:flex, kar bi sicer premagalo atribut hidden */
[hidden]{display:none !important}

/* ============================================================
   2. POSTAVITEV: GLAVA / VSEBINA / NOGA
   ============================================================ */
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:720px;margin:0 auto;
  background:var(--bg);
}
#topbar{
  height:calc(var(--topbar-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding-left:16px;padding-right:12px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
#ctxTitle{flex:1;min-width:0;font-size:19px;font-weight:650;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxTitle .sub{font-weight:400;color:var(--dim);font-size:15px;margin-left:6px}
#btnToday{
  flex:0 0 auto;font-size:14px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:7px 13px;border-radius:999px;
}
/* position:relative je nujen – da se offsetTop otrok meri glede na #feed
   in ne glede na #app (sicer se prvi dan skrije pod glavo). */
#feed{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

#bottombar{
  flex:0 0 auto;
  height:calc(var(--bottombar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;gap:10px;padding-left:12px;padding-right:12px;
  border-top:1px solid var(--line);background:var(--surface);
}
.seg{flex:1;display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:2px}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:550;color:var(--dim);
  transition:background .15s,color .15s;
}
.seg button.on{background:var(--surface);color:var(--text);font-weight:650;
  box-shadow:0 1px 3px rgba(0,0,0,.10)}
#btnAll{
  flex:0 0 auto;font-size:14px;font-weight:600;padding:9px 14px;
  border-radius:11px;background:var(--accent);color:#fff;
}

/* ============================================================
   3. TEDENSKI POGLED – seznam dni
   ============================================================ */
.week-block{padding:0 12px}
.week-head{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:baseline;gap:8px;
  padding:14px 6px 7px;background:var(--bg);
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);
}
.week-head .range{text-transform:none;letter-spacing:0;font-weight:500}
.days{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

.day-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-bottom:1px solid var(--line);
}
.day-row:last-child{border-bottom:0}
.day-row:active{background:var(--bg)}
.day-row.is-today{background:var(--today)}
.day-row.is-weekend .dnum,.day-row.is-weekend .dname{color:var(--dim)}

.day-date{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dnum{font-size:21px;font-weight:650;letter-spacing:-.02em}
.dname{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin-top:2px}
.day-row.is-today .dnum{color:var(--accent)}

.day-body{flex:1;min-width:0}
.day-chevron{flex:0 0 auto;color:var(--line);font-size:20px;margin-left:2px}

/* Števca v vrstici dneva.
   Obroček = odprte naloge, kljukica = opravljene. Obroček je namenoma
   prazen; ko pride sklop 5, se njegova obroba obarva po najnujnejši
   nalogi dneva – zato je barva na enem samem mestu (--obrocek). */
.stevci{display:flex;align-items:center;gap:30px}
.stevec{display:inline-flex;align-items:center;gap:7px;
  font-size:17px;font-weight:600;line-height:1}
.stevec .obrocek{
  width:16px;height:16px;border-radius:50%;flex:0 0 auto;
  background:transparent;border:2px solid var(--obrocek);
}
.stevec.opravljene{color:var(--dim);font-weight:500;gap:6px}

/* ============================================================
   4. MESEČNI POGLED – mreža
   ============================================================ */
.month-block{padding:6px 12px 20px}
.month-head{
  position:sticky;top:0;z-index:5;padding:14px 4px 8px;background:var(--bg);
  font-size:17px;font-weight:700;letter-spacing:-.01em;
}
/* Razmik 4 px je isti kot v mreži dni spodaj. Brez njega so stolpci
   vrstice dni široki 52,71 px, stolpci mreže pa 49,28 px, zato črka ni
   stala nad sredino svojega stolpca. Odmik med črkami je 0, ker se pri
   eni sami črki šteje tudi za njo in jo premakne z sredine.
   (Sklop 3, dodatek 30. 8. 2026.) */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{
  aspect-ratio:1/1;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;
  font-size:15px;font-weight:550;
  /* Številka dneva stoji VEDNO na vrhu polja, značka VEDNO na dnu
     (space-between). Prej je bilo justify-content:center, zato se je
     številka ob znački dvignila: izmerjeno 30. 8. 2026 je bila v isti
     vrstici za 9,5 px više od sosednjih. Zdaj je razlika 0 – vse
     številke stojijo v ravni liniji. Polje se ob znački podaljša.
     Odmik je izbran 30. 8. 2026: brez njega (varianta A). Vrstica z
     zapiskom je 53,6 px, vrstica brez njega ostane 49,3 px.
     (Sklop 3, točka 36.) */
  /* Polje se sme POVIŠATI, ne sme pa se razširiti.
     Brez teh treh vrstic značka s številom nalog razširi stolpec (v mreži
     je najmanjša širina samodejno enaka vsebini), razmerje stranic 1:1 pa
     širino prenese nazaj v višino. Sedem takih polj je bilo široko 375,5 px,
     zaslon pa daje 369 px – zadnji stolpec je padel čez desni rob.
       min-width:0         stolpec se ne razširi po vsebini
       width:100%          polje ostane široko natanko kot stolpec
       align-self:stretch  vsa polja v isti vrstici so enako visoka
     Izmerjeno 30. 8. 2026: brez katere koli od treh se popravek pokvari.
     (Sklop 3, točka 36.) */
  min-width:0;width:100%;align-self:stretch;
}
.cell.pad{background:transparent;border-color:transparent;color:transparent;pointer-events:none}
.cell.is-today{background:var(--today);border-color:var(--accent);color:var(--accent);font-weight:750}
.cell:active{background:var(--bg)}
.cell .cnt{
  min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--accent);
  color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.cell .dot{width:5px;height:5px;border-radius:50%;background:var(--line)}

/* ============================================================
   5. LETNI POGLED – 12 mini mesecev
   ============================================================ */
.year-block{padding:6px 12px 24px}
.year-head{position:sticky;top:0;z-index:5;padding:14px 4px 10px;background:var(--bg);
  font-size:20px;font-weight:750;letter-spacing:-.02em}
.year-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
/* Mesec je kvadrat vedno enake velikosti. Zgornja polovica nosi kratico
   meseca, spodnja število odprtih nalog. Mreže dni in številk dni ni več,
   zato klika na posamezen dan tu ni – klik na mesec odpre mesečni prikaz.
   min-width:0 in width:100% sta tu iz istega razloga kot pri mesečni
   celici: brez njiju vsebina razširi stolpec čez rob zaslona.
   (Sklop 3, točka 29, 30. 8. 2026.) */
.mini{
  aspect-ratio:1/1;min-width:0;width:100%;padding:0;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;
}
/* Debelina 400: imena mesecev naj bodo navadne debeline (Želje, 30. 8. 2026). */
.mini h4{flex:1;margin:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.mini .mcnt{flex:1;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:750;color:var(--accent)}
.mini .mcnt.prazno{color:transparent}
.mini.je-danes{border-color:var(--accent)}
.mini:active{background:var(--bg)}

/* ============================================================
   6. LISTI (dnevni pogled, vse naloge)
   ============================================================ */
.sheet{
  position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
  /* List se drži VIDNEGA dela zaslona, ne celega. Brez tega njegovo
     dno konča pod tipkovnico in do njega ni mogoče zdrsniti. */
  top:var(--vidni-vrh);bottom:auto;height:var(--vidna-visina);
}
.sheet.open{transform:translateY(0);visibility:visible}
.sheet-top{
  flex:0 0 auto;height:calc(var(--topbar-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:8px;padding-left:8px;padding-right:12px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.sheet-back{font-size:15px;font-weight:600;color:var(--accent);padding:8px 10px;flex:0 0 auto}
.sheet-title{flex:1;min-width:0;font-size:17px;font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}

/* dnevna glava */
/* Glava strani »Vse«. Razpon datumov je nacentriran na sredino
   (Želje, 30. 8. 2026). Razred .big je odpadel s točko 37. */
.day-hero{padding:6px 6px 14px;text-align:center}
.day-hero .small{font-size:14px;color:var(--dim);margin-top:2px}

/* alineje */
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
/* scroll-margin-bottom je namenoma 0: nov zapisek se poravna točno s
   spodnjim robom vidnega dela, da pod njim ne pokuka odkljukani zapisek. */
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 12px;border-bottom:1px solid var(--line);
  scroll-margin-bottom:0;position:relative}
.note:last-child{border-bottom:0}
/* Krogec stoji desno od datuma (premaknjen 21. 8. 2026). */
.chk{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  margin:0 0 4px 8px;vertical-align:middle;
  border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;transition:background .15s,border-color .15s;
}
.note.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.note-main{flex:1;min-width:0}
.note-date{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;
  color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:5px;margin-bottom:4px;
}
.note.carried .note-date::after{content:" ↷";font-weight:700}
/* pre-wrap: prelomi vrstic, ki jih naredi tipka Enter, se vidijo.
   ::first-line: krepka je prva vrstica NA ZASLONU – katere besede so v njej,
   se sme spremeniti ob obračanju telefona. Izmerjeno 1. 9. 2026 na iPhonu
   (Safari 26.6): deluje tudi v polju, v katero se piše. */
.note-text{
  flex:1 1 auto;min-width:0;              /* polje je široko toliko kot vrstica */
  font-size:16px;line-height:1.4;outline:none;word-break:break-word;min-height:22px;
  white-space:pre-wrap;
}
.note-text::first-line{font-weight:700}
/* Prvi dotik pripravi besedilo: rumeno postane tisto, kar je sicer belo. */
.note-text.pripravljeno{background:#fff6cc;border-radius:5px}
.note-text:empty::before{content:"Nov zapisek…";color:var(--dim)}
.note.done .note-text{text-decoration:line-through;color:var(--dim)}
/* Gumba stojita v zgornjem desnem kotu, zunaj vrste. Tako besedilo
   ni več ožje od zapiska – odstavki tečejo po celi širini pod njima.
   Izmerjeno: gumba sežeta do 28 px od vrha, besedilo se začne pri 45 px,
   zato pod njima ni ničesar, kar bi zakrila. */
.note-del{position:absolute;top:12px;right:12px;
  width:28px;height:28px;border-radius:50%;color:var(--dim);
  font-size:17px;display:flex;align-items:center;justify-content:center}
.note-del:active{background:var(--bg);color:var(--danger)}
.note-move{position:absolute;top:12px;right:50px;
  width:28px;height:28px;border-radius:50%;color:var(--dim);
  display:flex;align-items:center;justify-content:center}
.note-move:active{background:var(--bg);color:var(--accent)}
.note-move svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

/* --- ura na začetku besedila --- */
.note-line{display:flex;align-items:flex-start;gap:8px}
.ura-btn{
  flex:0 0 auto;display:flex;align-items:baseline;gap:5px;margin-top:1px;
  padding:2px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.35;
}
.ura-btn small{font-size:11px;font-weight:600;opacity:.8}
.ura-btn:active{filter:brightness(.94)}
.ura-btn.prazna{                       /* urica, dokler ure ni */
  background:transparent;color:var(--dim);padding:2px 2px;
}
.ura-btn.prazna svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.note.done .ura-btn{background:transparent;color:var(--dim);text-decoration:line-through}
.note.done .ura-btn.prazna{display:none}   /* odkljukani nalogi se ure ne da dodati */

/* Med pisanjem novega zapiska so odkljukani skriti.
   Vrnejo se takoj, ko pisanje končate. */
.sheet-body.pisemo .note.done{display:none}

/* opozorilna vrstica v okencu */
.opozorilo{
  margin:0 0 8px;padding:11px 14px;border-radius:11px;
  background:#fdecea;color:#8c2f22;font-size:14px;font-weight:600;
}
.opozorilo.mirno{background:var(--bg);color:var(--dim);font-weight:500}
/* Opozorilo o pretekli uri stoji na sredini okenca. */
#uraOpozorilo{text-align:center}

/* Odložen zapisek: namesto napisa stoji ikona – ukrivljena puščica v desno,
   takoj desno ob krogcu za odkljukanje. Barva in ozadje sta enaka kot pri
   datumu in uri, da se vsi trije znaki berejo kot ena družina. */
.note-wait{
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--accent);background:var(--accent-soft);
  padding:5px 7px;border-radius:5px;margin:0 0 4px 8px;vertical-align:middle;
}
.note-wait svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* ============================================================
   6b. OKENCE ZA PREMIK NALOGE
   ============================================================ */
.modal{position:fixed;inset:0;z-index:60;visibility:hidden}
.modal.open{visibility:visible}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .22s}
.modal.open .modal-bg{opacity:1}
.modal-card{
  position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 14px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;
}
.modal.open .modal-card{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 12px}
.modal h3{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.modal .lead{margin:0 0 14px;font-size:14px;color:var(--dim)}
.opt{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 15px;border-radius:12px;background:var(--bg);margin-bottom:8px;
  font-size:16px;font-weight:600;text-align:left;
}
.opt:active{background:var(--accent-soft)}
.opt .when{color:var(--dim);font-weight:400;font-size:14px;white-space:nowrap}
.opt.reset{color:var(--accent)}
.opt.cancel{background:transparent;justify-content:center;color:var(--dim);font-weight:550;margin-top:4px}
.opt .chev{color:var(--dim);font-weight:400}

/* --- koledar dveh tednov: ponedeljek levo, tri vrstice, petnajst dni --- */
.oznaka{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--dim);padding:2px 4px 7px}
.oznaka.sredina{text-align:center}
.lead.sredina{text-align:center}

/* glava okna za premik: ikona na sredini */
.premik-glava{display:flex;align-items:center;justify-content:center;padding:2px 4px 10px}
.premik-ikona{display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;color:var(--text)}
.premik-ikona svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* gumb z ikono na levi in nacentriranim napisom */
.opt.sredinsko{justify-content:center;gap:9px}
.ikona-levo{display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--dim)}
.ikona-levo svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;display:block}

.dow-premik{display:grid;grid-template-columns:repeat(7,1fr);padding:0 5px 3px}
.dow-premik span{text-align:center;font-size:11px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
.dayline{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;
  background:var(--bg);border-radius:12px;padding:5px;margin-bottom:10px}
.dayline button{
  min-width:0;display:flex;align-items:center;justify-content:center;
  padding:11px 1px;border-radius:9px;font-size:15px;font-weight:650;line-height:1;
}
.dayline button:active{background:var(--accent-soft)}
.dayline .prazno{visibility:hidden;pointer-events:none}
.dayline button.mimo{                      /* pretekli dnevi – vanje ni mogoče pisati */
  color:var(--line);pointer-events:none;
}
.dayline button.cur{                       /* dan, na katerem smo – ni izbirljiv */
  background:var(--surface);color:var(--accent);pointer-events:none;
  box-shadow:inset 0 0 0 1.5px var(--accent);
}
.dayline button.wknd{color:var(--danger);opacity:.85}

/* --- "Drug datum": sistemski izbirnik čez celo vrstico ---
   Polje za datum je raztegnjeno čez ves gumb in prosojno, zato se
   sistemski koledar odpre ob dotiku kjerkoli po vrstici, ne le na ikoni. */
.pickwrap{position:relative}
.pickwrap input{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;margin:0;padding:0;
  -webkit-appearance:none;appearance:none;background:transparent;
}
/* --- LASTNO KOLESJE ZA URO ---
   Sistemsko kolesje ne spoštuje koraka 5 minut in se na telefonu
   samo od sebe zapira, zato je narejeno lastno. Dva stolpca, ki se
   vrtita in se zaskočita na sredino (scroll-snap). */
.kolo{
  position:relative;display:flex;align-items:stretch;justify-content:center;gap:4px;
  height:176px;margin:4px 0 14px;background:var(--bg);border-radius:14px;overflow:hidden;
}
.kolo-pas{                          /* svetel pas, ki kaže izbrano vrstico */
  position:absolute;left:10px;right:10px;top:50%;height:44px;margin-top:-22px;
  background:var(--accent-soft);border-radius:10px;pointer-events:none;
  z-index:0;                        /* mora biti POD številkami, sicer jih prekrije */
}
.kolo-dvopicje{
  position:relative;z-index:1;
  align-self:center;font-size:24px;font-weight:700;color:var(--dim);
  padding-bottom:2px;pointer-events:none;
}
.kolo-stolpec{
  position:relative;z-index:1;
  width:82px;overflow-y:scroll;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:none;padding:66px 0;             /* (176-44)/2 = 66 */
}
.kolo-stolpec::-webkit-scrollbar{display:none}
.kolo-stolpec b{
  display:flex;align-items:center;justify-content:center;
  height:44px;scroll-snap-align:center;
  font-size:26px;font-weight:600;letter-spacing:.01em;
  color:var(--dim);font-variant-numeric:tabular-nums;
}
.kolo-stolpec b.on{color:var(--text);font-weight:750}
.opt.potrdi{background:var(--accent);color:#fff;justify-content:center;font-weight:700}

/* ---- koledar za "Drug datum" (lastna komponenta) ---- */
.cal{-webkit-user-select:none;user-select:none;display:flex;flex-direction:column}
.cal-head{display:flex;align-items:center;gap:6px;padding:2px 2px 10px;flex:0 0 auto}
.cal-title{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em}
.cal-nav{
  width:38px;height:38px;border-radius:50%;background:var(--bg);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:0 0 auto;
}
.cal-nav:active{background:var(--accent-soft)}
.cal-nav[disabled]{color:var(--line);pointer-events:none}
/* Vrstica dni: ena sama črka, isti razmik kot mreža, da črka stoji nad
   sredino svojega stolpca. Enako kot v mesečnem prikazu. (30. 8. 2026.) */
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;flex:0 0 auto}
.cal-dow span{text-align:center;font-size:11px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:0}

/* Drseči seznam mesecev. Brez zaskakovanja, zato sta med drsenjem vidna
   del enega in del naslednjega meseca. Glava, vrstica dni in gumb Nazaj
   ostanejo na isti višini, ker seznam drsi sam v sebi. */
.cal-list{
  /* position:relative je nujen: brez njega se offsetTop mesecev meri
     glede na okence in ne glede na seznam, zato koledar zdrsne predaleč.
     Ista past kot pri #feed. Izmerjeno 30. 8. 2026. */
  position:relative;
  flex:1 1 auto;height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scrollbar-width:none;
}
.cal-list::-webkit-scrollbar{display:none}
.cal-crta{
  display:flex;align-items:center;gap:10px;padding:12px 2px 8px;
  font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--dim);text-transform:uppercase;
}
.cal-crta::before,.cal-crta::after{content:"";flex:1;height:1px;background:var(--line)}
.cal-mesec:first-child .cal-crta{padding-top:2px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  aspect-ratio:1/1;min-width:0;width:100%;border-radius:10px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
}
.cal-day:active{background:var(--accent-soft)}
.cal-day.pad{background:transparent;pointer-events:none}
/* Vrstni red je pomemben in je bil izbran 30. 8. 2026:
   .off posivi navadne dneve; .sel obrobi dan, v katerem ste urejali;
   .today pobarva celo polje in je ZADNJI, ker ob prekrivanju zmaga
   današnji dan. Zadnja vrstica poskrbi, da nedejavnih dni ni mogoče
   klikniti, ne glede na to, kako so pobarvani. */
.cal-day.off{color:var(--line);background:transparent;box-shadow:none}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:750;background:var(--bg)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:750;box-shadow:none}
.cal-day.off{pointer-events:none}
.cal-nazaj{margin-top:10px}

.add-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:12px;padding:14px;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-size:16px;font-weight:650;
}
.add-btn:active{opacity:.85}
/* Pretekli dan: v tak dan zapiska ni mogoče vpisati – zapisek bi se takoj
   prenesel na današnji dan in v tem dnevu sploh ne bi bil viden. Zato je
   gumb posivljen in ugasnjen. Izmerjeno 22. 8. 2026. */
.add-btn[disabled]{background:var(--line);color:var(--dim);font-weight:600}
.add-btn[disabled]:active{opacity:1}

.empty{text-align:center;color:var(--dim);font-size:15px;padding:34px 20px}

/* skupine v "vse naloge" */
.group-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--dim);padding:18px 6px 8px;text-align:center}
.group-title:first-child{padding-top:4px}

/* Ločilna črta med datumi nastanka v seznamu »Vse naloge«.
   Samo v skupini »Odprte« – tam je seznam po datumu nastanka že urejen,
   zato je črta samo izris. V skupini »Opravljene« črt ni.
   Napis na črti in značka na zapisku pod njo kažeta isti datum.
   (Sklop 3, točka 32.) */
.crta{
  display:flex;align-items:center;gap:10px;padding:9px 12px 7px;
  background:var(--bg);
  font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--dim);
}
.crta::before,.crta::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============================================================
   8. OBVESTILO PO PREMIKU
   En sam trak nad vsem drugim. Na dotik se namenoma ne odziva
   (pointer-events:none), zato ne more prestreči klika na gumb pod njim.
   ============================================================ */
#obvestilo{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  z-index:70;pointer-events:none;
  max-width:min(88vw,420px);
  padding:12px 18px;border-radius:999px;
  background:#e7e6e2;color:#1c1b19;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translate(-50%,10px);
  transition:opacity .18s ease,transform .18s ease;
}
#obvestilo.vidno{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   9. ZAČASNO: enotna pisava 17 px
   Dodano 21. 8. 2026, ker je bilo na telefonu premajhno.
   Zajema samo tisto, kar je bilo manjše od 17 px.
   Izjeme po dogovoru: številka dneva (21 px), kolesje za uro,
   številke v letnem prikazu (9 px), veliki datum na dnevnem listu.
   Blok je namenoma na koncu in v enem kosu, da ga sklop 13 (dizajn)
   zbriše z enim potegom in velikosti določi pravilno.
   ============================================================ */
.note-date,.note-wait,.ura-btn,.ura-btn small,.chk,.cell .cnt,.dayline .dw,
.dname,.dow span,.cal-dow span,.week-head,.group-title,.oznaka,.mini h4,
.cell,.cal-day,.seg button,.opt,.opt .when,.note-text,.add-btn,.sheet-back,
.empty,.dayline button,#ctxTitle .sub,.opozorilo,.modal .lead,.day-hero .small,
#btnToday,#btnAll{font-size:17px}
/* Balonček v mesečni celici mora zrasti, sicer številka pri 17 px ne gre vanj.
   Izmerjeno 21. 8. 2026: v škatlici 17 pik besedilo potrebuje 21. */
.cell .cnt{min-width:24px;height:24px;padding:0 5px}

/* ============================================================
   10. PREHOD POGLEDA – zapisek odpotuje na dno
   Brskalnik posname staro in novo sliko seznama in med njima
   potuje sam. Kdor tega ne zna, prerisuje kot doslej.
   Če ima telefon vklopljeno "manj gibanja", animacije ni.
   ============================================================ */
@media (prefers-reduced-motion: no-preference){
  ::view-transition-group(*){
    animation-duration:.30s;
    animation-timing-function:cubic-bezier(.32,.72,0,1);
  }
}
</style>
</head>
